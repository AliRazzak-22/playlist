<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مشاركة الشاشة</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { font-family: system-ui, sans-serif; color: #fff; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #overlay { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; background: #000; }
    #overlay.hidden { display: none; }
    #detail { font-size: 14px; opacity: .7; }
    #sound-button { margin: 18px auto 0; padding: 12px 20px; border: 0; border-radius: 10px; background: #fff; color: #111; font: inherit; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <div id="overlay"><h3 id="status">جاري الاتصال بالبث…</h3><div id="detail"></div><button id="sound-button" type="button" hidden>تفعيل الصوت</button></div>
  <script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.3.0/firebase-database-compat.js"></script>
  <script>
  (() => {
    'use strict';
    const params = new URLSearchParams(location.search);
    const session = params.get('s') || '';
    const deviceId = params.get('d') || '';
    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('video');
    const soundButton = document.getElementById('sound-button');
    const scheduled = Number(params.get('t'));
    const startAt = Number.isSafeInteger(scheduled) && scheduled > 0 ? scheduled : 0;
    let serverOffset = 0, streamReady = false, startTimer = null;
    function say(text, extra = '') { status.textContent = text; detail.textContent = extra; }
    function serverNow() { return Date.now() + serverOffset; }
    if (!/^[A-Za-z0-9_-]{8,64}$/.test(session) || !/^[A-Za-z0-9_-]{6,64}$/.test(deviceId)) {
      say('رابط البث ناقص'); return;
    }
    if (!window.RTCPeerConnection || !window.firebase) { say('حدّث Android System WebView حتى يشتغل البث'); return; }
    firebase.initializeApp({
      apiKey: 'AIzaSyACHSjXB-UVG418YSsyedNPV48QbIB9OWA',
      authDomain: 'send-files-to-tv-d371a.firebaseapp.com',
      databaseURL: 'https://send-files-to-tv-d371a-default-rtdb.firebaseio.com',
      projectId: 'send-files-to-tv-d371a',
    });
    const base = firebase.database().ref(`screen_signal/${session}`);
    const offsetRef = firebase.database().ref('.info/serverTimeOffset');
    offsetRef.on('value', (snap) => {
      const value = Number(snap.val());
      serverOffset = Number.isFinite(value) ? value : 0;
      if (streamReady) armStart();
    });
    let pc = null, request = 0, retry = null, watchdog = null, closed = false;
    let lastOffer = '', lastFrameAt = 0, startedAt = Date.now(), stopped = false, seenSession = false;
    window.screenShareState = () => stopped ? 'stopped' : (lastFrameAt && Date.now() - lastFrameAt < 15000 ? 'playing' : 'connecting');
    base.on('value', (snap) => {
      if (snap.exists()) seenSession = true;
      else if (seenSession) { stopped = true; closed = true; clearTimeout(retry); closePeer(); say('انتهى البث'); }
    });
    function report(value) { base.child(`state/${deviceId}`).set(value).catch(() => {}); }
    function playStream() {
      video.muted = false;
      video.defaultMuted = false;
      video.volume = 1;
      video.play().catch((e) => {
        if (String(e && e.name) === 'NotAllowedError') {
          soundButton.hidden = false;
          say('اضغط لتفعيل الصوت');
        } else reconnect();
      });
    }
    function armStart() {
      if (closed || !streamReady) return;
      clearTimeout(startTimer);
      const wait = startAt ? Math.max(0, startAt - serverNow()) : 0;
      if (wait > 150) {
        video.pause();
        say('البث جاهز، يبدأ مع بقية الشاشات…', `بعد ${Math.ceil(wait / 1000)} ثانية`);
        startTimer = setTimeout(playStream, wait);
      } else playStream();
    }
    soundButton.addEventListener('click', () => { soundButton.hidden = true; playStream(); });
    function closePeer() {
      clearTimeout(watchdog);
      clearTimeout(startTimer);
      streamReady = false;
      soundButton.hidden = true;
      if (pc) pc.close();
      pc = null;
      lastOffer = '';
      video.srcObject = null;
    }
    function reconnect() {
      if (closed || retry) return;
      overlay.classList.remove('hidden');
      say('جاري إعادة الاتصال…', 'تأكد أن اللابتوب والشاشات على نفس الشبكة.');
      report('connecting');
      closePeer();
      retry = setTimeout(() => { retry = null; join(); }, 2000);
    }
    function join() {
      if (closed) return;
      request = Math.max(Date.now(), request + 1);
      base.child(`join/${deviceId}`).set(request).catch((e) => { say('فشل طلب البث', e.message); });
      report('connecting');
      clearTimeout(watchdog);
      watchdog = setTimeout(reconnect, 20000);
    }
    function waitIce(conn) {
      if (conn.iceGatheringState === 'complete') return Promise.resolve();
      return new Promise((resolve) => {
        const done = () => { clearTimeout(timer); conn.removeEventListener('icegatheringstatechange', changed); resolve(); };
        const changed = () => { if (conn.iceGatheringState === 'complete') done(); };
        const timer = setTimeout(done, 8000);
        conn.addEventListener('icegatheringstatechange', changed);
      });
    }
    async function answer(value) {
      if (closed || !value || value.n !== request || typeof value.sdp !== 'string' || value.sdp === lastOffer) return;
      seenSession = true;
      closePeer();
      lastOffer = value.sdp;
      const conn = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] });
      pc = conn;
      watchdog = setTimeout(reconnect, 20000);
      conn.oniceconnectionstatechange = () => {
        if (pc !== conn) return;
        if (['failed', 'disconnected'].includes(conn.iceConnectionState)) reconnect();
      };
      conn.ontrack = (event) => {
        if (pc !== conn) return;
        const receiver = event.receiver;
        try { if ('jitterBufferTarget' in receiver) receiver.jitterBufferTarget = 500; } catch (e) {}
        try { if ('playoutDelayHint' in receiver) receiver.playoutDelayHint = .5; } catch (e) {}
        video.srcObject = event.streams[0] || new MediaStream([event.track]);
        streamReady = true;
        armStart();
      };
      try {
        await conn.setRemoteDescription({ type: 'offer', sdp: value.sdp });
        await conn.setLocalDescription(await conn.createAnswer());
        await waitIce(conn);
        if (pc !== conn || closed) return;
        await base.child(`answer/${deviceId}`).set({ n: value.n, sdp: conn.localDescription.sdp });
        say('تم الربط، بانتظار الصورة…');
      } catch (e) {
        if (pc === conn) { say('فشل الربط', String(e.message).slice(0, 120)); reconnect(); }
      }
    }
    video.onplaying = () => {
      clearTimeout(watchdog);
      clearTimeout(startTimer);
      soundButton.hidden = true;
      overlay.classList.add('hidden');
      lastFrameAt = Date.now();
      report('playing');
    };
    video.ontimeupdate = () => { if (!video.paused && !video.requestVideoFrameCallback) lastFrameAt = Date.now(); };
    if (video.requestVideoFrameCallback) {
      const frame = () => { lastFrameAt = Date.now(); if (!closed) video.requestVideoFrameCallback(frame); };
      video.requestVideoFrameCallback(frame);
    }
    const monitor = setInterval(() => {
      if (!closed && Date.now() - (lastFrameAt || startedAt) > 60000) {
        stopped = true; closed = true; clearTimeout(retry); closePeer(); say('تعذر الاتصال بالبث'); report('connecting');
      } else if (!closed && pc && video.requestVideoFrameCallback && lastFrameAt && Date.now() - lastFrameAt > 15000) reconnect();
    }, 5000);
    base.child(`offer/${deviceId}`).on('value', (snap) => answer(snap.val()), (e) => say('فشل الاتصال', e.message));
    join();
    window.addEventListener('pagehide', () => {
      closed = true; clearTimeout(retry); clearInterval(monitor); closePeer(); base.off(); offsetRef.off();
    });
  })();
  </script>
</body>
</html>
