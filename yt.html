<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>player</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #box { position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; }
  #box.portrait { width: calc(100vh * 9 / 16); }
  #box iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="box"><div id="yt"></div></div>
<script>
'use strict';
(function () {
  var player = null, apiReady = false, ready = false, error = 0, live = false;
  var pending = null, startAt = 0, primed = false, volume = 1, quality = '';
  var generation = 0, stateGeneration = null, apiFailed = false;

  function destroyPlayer() {
    var previous = player;
    player = null;
    if (previous && previous.destroy) previous.destroy();
  }

  function vol(v) {
    if (!player || !player.setVolume) return;
    if (v <= 0) player.mute(); else { player.unMute(); player.setVolume(Math.round(v * 100)); }
  }

  var QUALITY = { '1080p': 'hd1080', '720p': 'hd720', '480p': 'large', '360p': 'medium', '240p': 'small' };
  // Set once: re-forcing on every quality event makes the player switch streams and rebuffer.
  function lockQuality() {
    var q = QUALITY[quality];
    if (q && player && player.setPlaybackQuality) player.setPlaybackQuality(q);
  }

  // getCurrentTime() arrives from the iframe by postMessage, late by a varying amount. Sampling
  // often and keeping the freshest (largest) time-minus-clock offset gives a steady position.
  var offsets = [], lastRaw = -1;
  function resetClock() { offsets = []; lastRaw = -1; }
  function sampleClock() {
    if (!player || !player.getCurrentTime || !player.getPlayerState) return;
    if (player.getPlayerState() !== 1) { resetClock(); return; }
    var raw = (player.getCurrentTime() || 0) * 1000, now = performance.now();
    if (raw === lastRaw) return;
    lastRaw = raw;
    var off = raw - now;
    if (offsets.length && Math.abs(off - best()) > 250) offsets = [];
    offsets.push({ off: off, at: now });
    while (offsets.length && now - offsets[0].at > 2000) offsets.shift();
  }
  function best() {
    var m = -Infinity;
    for (var i = 0; i < offsets.length; i++) if (offsets[i].off > m) m = offsets[i].off;
    return m;
  }
  function position() {
    if (!player || !player.getCurrentTime) return 0;
    if (player.getPlayerState && player.getPlayerState() === 1 && offsets.length >= 2) return (best() + performance.now()) / 1000;
    return player.getCurrentTime() || 0;
  }
  setInterval(sampleClock, 15);

  function create(id, loadGeneration) {
    if (loadGeneration !== generation) return;
    var box = document.getElementById('box');
    box.textContent = '';
    var slot = document.createElement('div');
    slot.id = 'yt';
    box.appendChild(slot);
    function current(e) {
      return loadGeneration === generation && player === instance && e.target === instance;
    }
    var instance = new YT.Player('yt', {
      videoId: id,
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1,
        playsinline: 1, rel: 0, start: Math.floor(startAt), mute: 1, origin: location.origin },
      events: {
        onReady: function (e) {
          if (!current(e) || primed) return;
          lockQuality(); player.mute(); player.playVideo();
        },
        onStateChange: function (e) {
          if (!current(e)) return;
          if (e.data === YT.PlayerState.PLAYING && !primed) {
            primed = true;
            var d = player.getDuration();
            live = !!(player.getVideoData && player.getVideoData().isLive) || d === 0;
            lockQuality();
            player.pauseVideo();
            if (!live) player.seekTo(startAt, true);
            vol(volume);
          } else if (primed && !ready && e.data === YT.PlayerState.PAUSED) {
            ready = true;
          }
          if (e.data !== YT.PlayerState.PLAYING) resetClock();
        },
        onError: function (e) { if (current(e)) error = e.data || 1; }
      }
    });
    player = instance;
  }

  function load(id, sec, v, portrait, q, g) {
    generation++;
    stateGeneration = typeof g === 'number' ? g : generation;
    pending = null;
    destroyPlayer();
    document.getElementById('box').className = portrait ? 'portrait' : '';
    resetClock();
    startAt = Math.max(0, sec); volume = v; quality = q || ''; ready = false; primed = false; error = 0; live = false;
    if (!apiReady) { pending = { id: id, generation: generation }; return; }
    create(id, generation);
  }

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    if (pending) { var load = pending; pending = null; create(load.id, load.generation); }
  };

  window.sig = {
    load: load,
    play: function () { if (player && player.playVideo) player.playVideo(); },
    pause: function () { if (player && player.pauseVideo) player.pauseVideo(); },
    seek: function (s) { resetClock(); if (player && player.seekTo) player.seekTo(Math.max(0, s), true); },
    volume: function (v) { volume = v; vol(v); },
    stop: function () {
      generation++; stateGeneration = null; pending = null;
      ready = false; primed = false; error = 0; live = false;
      destroyPlayer();
    },
    state: function () {
      var ok = !!(player && player.getPlayerState);
      return { g: stateGeneration, r: ready, s: ok ? player.getPlayerState() : -1, t: ok ? position() : 0,
        d: ok ? (player.getDuration() || 0) : 0, e: error || (apiFailed && stateGeneration != null ? 1 : 0), l: live };
    }
  };

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function () { apiFailed = true; };
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
